<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 식단 추천</title>

<link rel="stylesheet" href="/css/style.css">
<script src="/js/main.js"></script>

</head>
<body>
  <div class="container">
    <h1>AI 식단 추천</h1>

    <p class="description">
      아래 정보를 입력하면 AI가 하루 식단표를 추천합니다.
    </p>

    <div class="form-box">
      <label for="mealStyle">식사 스타일</label>
      <select id="mealStyle">
        <option value="">선택해주세요</option>
        <option value="가볍게">가볍게</option>
        <option value="든든하게">든든하게</option>
        <option value="건강하게">건강하게</option>
        <option value="다이어트">다이어트</option>
        <option value="고단백">고단백</option>
      </select>

      <label for="preferredFood">선호 음식 또는 재료</label>
      <input
        id="preferredFood"
        type="text"
        placeholder="예: 계란, 닭고기, 한식, 면요리"
      />

      <label for="avoidFood">피하고 싶은 음식</label>
      <input
        id="avoidFood"
        type="text"
        placeholder="예: 해산물, 매운 음식, 우유"
      />

      <label for="budget">하루 예산</label>
      <input
        id="budget"
        type="text"
        placeholder="예: 하루 10,000원 이하"
      />

      <button id="recommendBtn" type="button">추천받기</button>
    </div>

    <p id="loading" style="display: none;">
      AI가 오늘의 식단을 고민하는 중입니다...
    </p>

    <div id="result" class="result-box">
      <h2>추천 결과가 여기에 표시됩니다.</h2>
      <p>입력값을 작성한 뒤 추천받기 버튼을 눌러주세요.</p>
    </div>
  </div>
</body>
</html>
